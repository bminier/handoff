name: ci

on:
  push:
    branches: [dev, 'prerelease/**', 'release/**']
  pull_request:
    branches: [dev, 'prerelease/**', 'release/**']

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: bun run format:check

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # Go through the package.json script so the --max-concurrency=1
        # flag (pinning the helpers' single-threaded assumption) is honoured
        # in CI exactly the way it is locally.
        run: bun run test

      - uses: astral-sh/setup-uv@v5

      - name: Python tests
        run: uv run pytest tests/install_test.py -v
